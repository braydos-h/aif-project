[package]
name = "aif-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust HTTP backend for the cow weight estimator"
license = "MIT"
repository = "https://github.com/braydos-h/aif-project"
keywords = ["ollama", "estimator", "http"]

[dependencies]
ureq = { version = "2", features = ["tls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"

[profile.release]
strip = true
