name: Build Windows Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path backend/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Guard against tracked secrets
        run: test -z "$(git ls-files .env)"
        shell: bash

      - name: Run Rust tests
        run: cargo test --manifest-path backend/Cargo.toml

      - name: Build Rust backend (release)
        run: cargo build --release --manifest-path backend/Cargo.toml

      - name: Upload backend to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend/target/release/aif-backend.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CowWeightEstimator-backend-windows
          path: backend/target/release/aif-backend.exe
