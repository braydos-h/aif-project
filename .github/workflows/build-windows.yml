name: Build Windows Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test --manifest-path backend/Cargo.toml

      - name: Build Rust backend (release)
        run: cargo build --release --manifest-path backend/Cargo.toml

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows executable
        run: pyinstaller --noconfirm CowWeightEstimator.spec

      - name: Upload executables to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CowWeightEstimator.exe
            backend/target/release/aif-backend.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CowWeightEstimator-windows
          path: dist/CowWeightEstimator.exe
