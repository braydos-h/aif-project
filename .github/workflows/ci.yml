name: CI

# Run the full test suite on every commit and pull request.
# Covers the Rust backend (fmt/clippy/tests/build including real-HTTP
# integration tests) + WebUI JS syntax check.  Mirrors the commands in
# CONTRIBUTING.md / AGENTS.md:
#   cargo fmt --check --manifest-path backend/Cargo.toml
#   cargo test --manifest-path backend/Cargo.toml
#   cargo build --release --manifest-path backend/Cargo.toml
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Shared key keeps ubuntu/windows caches separate automatically.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Rust formatting
        run: cargo fmt --manifest-path backend/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Guard against tracked secrets
        # .env is gitignored but was once tracked; fail loudly if it ever is again.
        run: test -z "$(git ls-files .env)"

      - name: Guard against unsafe dynamic HTML
        # Dynamic browser values must use textContent/DOM APIs, never string-built HTML.
        run: '! grep -rn --include=*.js -E "innerHTML|outerHTML|insertAdjacentHTML|document\.write|eval\(|new Function" web/'

      - name: Guard against browser-stored secrets
        # Session tokens, passwords, invite/reset tokens, and photos must never
        # land in web storage.
        run: '! grep -rn --include=*.js -E "localStorage|sessionStorage" web/'

      - name: Check deploy scripts
        run: sh -n deploy/install.sh && sh -n deploy/update.sh && sh -n deploy/rollback.sh && sh -n deploy/backup.sh && sh -n deploy/restore.sh

      - name: Set up Node for WebUI syntax check
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run Rust tests
        # Includes the real-HTTP integration tests in backend/tests/server.rs
        # (spawned binary + static WebUI guards).
        run: cargo test --manifest-path backend/Cargo.toml

      - name: Build Rust backend (release)
        run: cargo build --release --manifest-path backend/Cargo.toml

      - name: Validate WebUI syntax
        run: node --check web/app.js && node --check web/account.js

      - name: Run reference evaluation (synthetic fixture)
        # Real-data acceptance stays blocked (eval/README.md); this guards
        # the framework, schema, and gate plumbing on synthetic rows.
        run: AIF_AI_BACKEND=none cargo run --manifest-path backend/Cargo.toml --bin aif-eval -- --dataset eval/fixtures/example.json --out /tmp/opencode/eval-report.json
