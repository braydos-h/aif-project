name: CI

# Run the full test suite on every commit and pull request.
# Covers the Rust backend (fmt/clippy/tests/build including real-HTTP
# integration tests) + WebUI JS syntax check.  Mirrors the commands in
# CONTRIBUTING.md / AGENTS.md:
#   cargo fmt --check --manifest-path backend/Cargo.toml
#   cargo test --manifest-path backend/Cargo.toml
#   cargo build --release --manifest-path backend/Cargo.toml
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Shared key keeps ubuntu/windows caches separate automatically.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Rust formatting
        run: cargo fmt --manifest-path backend/Cargo.toml -- --check

      - name: Rust clippy
        # Clippy is advisory; don't block the whole suite but surface warnings.
        # Remove `continue-on-error` if you want clippy to be required.
        run: cargo clippy --manifest-path backend/Cargo.toml -- -D warnings
        continue-on-error: true

      - name: Run Rust tests
        # Includes the real-HTTP integration tests in backend/tests/server.rs
        # (spawned binary + static WebUI guards).
        run: cargo test --manifest-path backend/Cargo.toml

      - name: Build Rust backend (release)
        run: cargo build --release --manifest-path backend/Cargo.toml

      - name: Validate WebUI syntax
        run: node --check web/app.js
